<!DOCTYPE html>

<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body>
  <div class="promo-banner">
    <img src="./eisenhower-matrix.jpg">
    <a class="link-more-info"href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>
  <div class="content-wrapper">
    <p id="section-for-add-task">
      <label for="new-task" class="section-head">Add Item</label>
    <div class="task-row-wrapper">
      <input id="new-task" class="task__input" type="text">
      <button class="button">Add</button>
    </div>  
    </p>
    <h3 class="section-head">Todo</h3>
    <ul class="task-list" id="incomplete-tasks">
      <li class="task-item">
        <input type="checkbox"><label class="task__label">Pay Bills</label>
        <input type="text" class="task__input">
        <button class="button button-edit">Edit</button>
        <button class="button button-delete">
          <img src="./remove.svg">
        </button>
      </li>
      <li class="task-item edit-mode">
        <input type="checkbox">
        <label class="task__label">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task__input">
        <button class="button button-edit">Save</button>
        <button class="button button-delete"><img src="./remove.svg"></button></li>
    </ul>
    <h3 class="section-head">Completed</h3>
    <ul class="task-list" id="completed-tasks">
      <li class="task-item">
        <input type="checkbox" checked>
        <label class="task__label">See the Doctor</label>
        <input type="text" class="task__input">
        <button class="button button-edit">Edit</button>
        <button class="button button-delete"><img src="./remove.svg"></button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>

</html>
